title: PyAutoGrader
description: Free automated Python grading tool for educators. Create assignments with 60+ test types. Students grade on their own machines. Collect results your way.

twitter:
  card: summary_large_image

# Feature toggles
online_enabled: false
url: "https://pyautograder.github.io"
baseurl: ""

author:
  name: Jesse Sestito
  twitter: ""

# Build settings
theme: null
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Collections
collections:
  docs:
    output: true
    permalink: /docs/:path/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "doc"

# Plugins (GitHub Pages safe)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Include _pages folder
include:
  - _pages

# Exclude from build
exclude:
  - README.md
  - MANUAL_TASKS.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - assets/images/Originals
